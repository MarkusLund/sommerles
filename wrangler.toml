name = "sommerles"
main = "worker/index.js"
compatibility_date = "2025-01-01"
# Behold gratis workers.dev-URL aktiv (ellers slås den av når en route finnes).
workers_dev = true

# Eget domene via Workers Custom Domain krever at sonen ligger i Cloudflare.
# Vi bruker i stedet en redirect fra Webhuset til workers.dev-URL-en, så denne
# står deaktivert. Skru den på igjen hvis du senere flytter sonen til Cloudflare.
# routes = [
#   { pattern = "sommerles.haavelund.no", custom_domain = true }
# ]

# Statiske filer (Vite-bygget i ./dist) serveres direkte av Cloudflare.
# Worker-en kjører kun for /api/*; alt annet faller tilbake til index.html (SPA).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 = SQLite. database_id fylles inn av `npm run db:create`.
[[d1_databases]]
binding = "DB"
database_name = "sommerles"
database_id = "b7f35951-ec4d-4eab-b699-e2f1d16a6b4b"
